name: Release

# Bouton "Run workflow" dans l'onglet Actions : build + publication d'une Release avec l'APK
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      APP_VERSION: 1.0.${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle
      - run: ./gradlew --no-daemon assembleDebug
      - run: cp app/build/outputs/apk/debug/app-debug.apk KooyuFX24.apk
      - run: gh release create "v$APP_VERSION" KooyuFX24.apk --target "$GITHUB_SHA" --title "KooyuFX 24 $APP_VERSION" --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
